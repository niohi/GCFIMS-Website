<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC-FIMS | Student Dashboard</title>
    <link rel="icon" type="image/png" href="assets/favicon-16x16.png">
    <link rel="stylesheet" href="css/dashboard_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .user-welcome { text-align: right; border-left: 2px solid #e2e8f0; padding-left: 20px; }
        
        /* Sidebar Logo Area */
        .logo-area { display: flex; flex-direction: column; align-items: center; padding: 30px 0; text-align: center; }
        .sidebar-logo { max-width: 80px; height: auto; margin-bottom: 10px; }

        /* Header Mobile Logo Logic */
        .header-logo-img { display: none; max-width: 45px; height: auto; object-fit: contain; }

        .urgency-selector { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
        .urgency-tag { 
            padding: 10px 20px; border-radius: 12px; cursor: pointer; border: 2px solid #e2e8f0;
            font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 14px;
        }
        .urgency-tag.low:hover, .urgency-tag.low.active { border-color: #10b981; background: #ecfdf5; color: #065f46; }
        .urgency-tag.medium:hover, .urgency-tag.medium.active { border-color: #f59e0b; background: #fffbeb; color: #92400e; }
        .urgency-tag.high:hover, .urgency-tag.high.active { border-color: #ef4444; background: #fef2f2; color: #991b1b; }

        /* Color Coded Status Badges */
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(0,0,0,0.05); }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-inprogress { background: #dbeafe; color: #1e40af; }
        .status-resolved { background: #d1fae5; color: #065f46; }
        
        /* Urgency Badges */
        .badge-low { background: #ecfdf5; color: #065f46; }
        .badge-medium { background: #fffbeb; color: #92400e; }
        .badge-high { background: #fef2f2; color: #991b1b; }

        /* FIXED: History Filters Alignment based on image_81287d.png */
        .history-controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .filters-group {
            display: flex;
            flex-direction: row; /* Horizontal alignment */
            gap: 12px; /* Spacing between selects */
        }
        .filters-group select {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            min-width: 140px;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .filters-group select:hover {
            border-color: #36d456;
        }

        .image-modal {
            display: none; position: fixed; z-index: 9999; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.85);
            align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .image-modal-content {
            max-width: 80%; max-height: 85%; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s ease; cursor: zoom-in;
        }
        .close-modal-btn { position: absolute; top: 20px; right: 40px; color: white; font-size: 40px; cursor: pointer; }

        .timestamp { font-size: 11px; color: #64748b; font-weight: 600; display: block; margin-bottom: 4px; }

        @media (max-width: 768px) {
            .header-logo-img { display: block; margin-bottom: 10px; }
            .header-card { flex-direction: column; text-align: center; padding: 20px; }
            .user-welcome { text-align: center; border-left: none; padding-left: 0; margin-top: 15px; border-top: 1px solid #e2e8f0; padding-top: 10px; width: 100%; }
            .history-controls-wrapper { flex-direction: column; align-items: flex-start; }
            .filters-group { width: 100%; flex-direction: column; }
            .filters-group select { width: 100%; }
        }
    </style>
</head>
<body>
    <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <img src="assets/GCFIMSLOGO.png" alt="Logo" class="sidebar-logo">
            <h1 style="font-size: 20px; color: #006600; font-weight: 900; margin-top: 10px; letter-spacing: 1px;">GC-FIMS</h1>
        </div>

        <p class="nav-label">Main Menu</p>
        <ul class="nav-links">
            <li id="nav-dashboard" class="active"><a onclick="showView('dashboard')"><i class="fas fa-th-large"></i> Dashboard</a></li>
            <li id="nav-submit"><a onclick="showView('submit')"><i class="fas fa-plus-circle"></i> Submit Report</a></li>
            <li id="nav-history"><a onclick="showView('history')"><i class="fas fa-history"></i> History</a></li>
        </ul>

        <p class="nav-label" style="margin-top:auto;">Account</p>
        <ul class="nav-links">
            <li class="logout-link"><a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="header-card">
            <img src="assets/GCFIMSLOGO.png" alt="Logo" class="header-logo-img">
            <div style="flex: 1;">
                <h2>Gordon College</h2>
                <p>Facility Issue Management System (GC-FIMS)</p>
            </div>
            <div class="user-welcome">
                <span id="user-display-name" style="font-weight: 800; color: #006600; display: block; font-size: 18px;">Welcome!</span>
                <small id="user-display-role" style="color: #64748b; font-weight: 600;">Student Account</small>
            </div>
        </header>

        <!-- Dashboard View -->
        <section id="view-dashboard" class="dashboard-view active">
            <div class="view-header section-header-mobile">
                <h3 style="margin: 0;"><i class="fas fa-th-large" style="color: #006600;"></i> Student Dashboard</h3>
            </div>
            <div class="card" id="reports-container">
                <div class="section-header-mobile" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <h4 style="margin: 0;">My Reports Tracker</h4>
                    <select id="dashboardStatusFilter" onchange="loadReports()" style="padding: 6px 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 13px; font-weight: 600; background: #f8fafc;">
                        <option value="all">All Status</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
                <div id="tracker-list" style="margin-top: 20px;"></div>
            </div>
        </section>

        <!-- Submit View -->
        <section id="view-submit" class="dashboard-view">
            <div class="card">
                <h3 style="margin-bottom: 25px;">Submit New Report</h3>
                <form id="report-form" class="form-grid">
                    <div class="form-group full-width">
                        <label>Issue Title</label>
                        <input type="text" id="issue_title" placeholder="e.g., Broken projector mount" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Description</label>
                        <textarea id="description" rows="3" placeholder="Explain the problem..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category">
                            <option value="Furniture">Furniture</option>
                            <option value="Electrical">Electrical</option>
                            <option value="IT">IT Resources</option>
                            <option value="Plumbing">Plumbing</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="location" placeholder="e.g., Room 302" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Urgency Level</label>
                        <div class="urgency-selector">
                            <div class="urgency-tag low active" onclick="selectUrgency('Low', this)">Low 🟢</div>
                            <div class="urgency-tag medium" onclick="selectUrgency('Medium', this)">Medium 🟡</div>
                            <div class="urgency-tag high" onclick="selectUrgency('High/Emergency', this)">High/Emergency 🔴</div>
                        </div>
                        <input type="hidden" id="urgency_level" value="Low">
                    </div>
                    <div class="form-group full-width">
                        <label>Upload Photo Evidence</label>
                        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
                        <div class="image-preview" id="previewContainer">
                            <span style="color: #94a3b8;">No image selected</span>
                        </div>
                    </div>
                    <div class="full-width">
                        <button type="submit" class="btn-primary">Submit Report</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- History View -->
        <section id="view-history" class="dashboard-view">
            <div class="history-controls-wrapper">
                <h3 style="margin: 0;"><i class="fas fa-history"></i> Report History</h3>
                <div class="filters-group">
                    <select id="sortDate" onchange="loadReports()">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                    </select>
                    <select id="filterCategory" onchange="loadReports()">
                        <option value="all">All Categories</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Electrical">Electrical</option>
                        <option value="IT">IT Resources</option>
                        <option value="Plumbing">Plumbing</option>
                    </select>
                    <select id="filterHistoryStatus" onchange="loadReports()">
                        <option value="all">All Status</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
            </div>
            <div id="history-list"></div>
        </section>
    </main>

    <div id="imageViewerModal" class="image-modal" onclick="closeImageViewer()">
        <span class="close-modal-btn">&times;</span>
        <img class="image-modal-content" id="fullSizeImage" onclick="toggleZoom(event)">
    </div>

    <script>
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuIcon = mobileMenuBtn.querySelector('i');

        function toggleMobileMenu() {
            sidebar.classList.toggle('active');
            if (sidebar.classList.contains('active')) {
                overlay.style.display = 'block';
                setTimeout(() => overlay.style.opacity = '1', 10);
                menuIcon.classList.remove('fa-bars'); menuIcon.classList.add('fa-times');
            } else {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);
                menuIcon.classList.remove('fa-times'); menuIcon.classList.add('fa-bars');
            }
        }
        mobileMenuBtn.addEventListener('click', toggleMobileMenu);
        overlay.addEventListener('click', toggleMobileMenu);

        window.editingReportId = null;

        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if(user) {
                document.getElementById('user-display-name').innerText = `Welcome, ${user.name}!`;
                document.getElementById('user-display-role').innerText = `${user.role} Account`;
            }
            loadReports();

            const reportForm = document.getElementById('report-form');
            if (reportForm) {
                reportForm.addEventListener('submit', function(e) {
                    e.preventDefault(); 
                    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                    if (!currentUser) return;
                    let reports = JSON.parse(localStorage.getItem('reports')) || [];
                    const previewElem = document.getElementById('previewContainer');
                    const now = new Date();
                    const fullTimestamp = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    if (window.editingReportId) {
                        const index = reports.findIndex(r => r.id === window.editingReportId);
                        if (index !== -1) {
                            reports[index].title = document.getElementById('issue_title').value;
                            reports[index].desc = document.getElementById('description').value;
                            reports[index].cat = document.getElementById('category').value;
                            reports[index].loc = document.getElementById('location').value;
                            reports[index].urgency = document.getElementById('urgency_level').value;
                            if (previewElem.dataset.base64) reports[index].img = previewElem.dataset.base64;
                        }
                        alert('Report Updated!');
                    } else {
                        const newReport = {
                            id: Date.now(),
                            authorId: currentUser.email || currentUser.account_id, 
                            title: document.getElementById('issue_title').value,
                            desc: document.getElementById('description').value,
                            cat: document.getElementById('category').value,
                            loc: document.getElementById('location').value,
                            urgency: document.getElementById('urgency_level').value,
                            img: previewElem.dataset.base64 || '',
                            date: now.toISOString(),
                            displayDate: fullTimestamp,
                            status: 'Pending'
                        };
                        reports.push(newReport);
                        alert('Report Submitted!');
                    }
                    localStorage.setItem('reports', JSON.stringify(reports));
                    this.reset();
                    showView('dashboard');
                });
            }
        });

        window.loadReports = function() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) return;
            const rawReports = JSON.parse(localStorage.getItem('reports')) || [];
            const myReports = rawReports.filter(r => r.authorId === (currentUser.email || currentUser.account_id));
            
            const trackerList = document.getElementById('tracker-list');
            const historyList = document.getElementById('history-list');

            // Dashboard Tracker
            const dashFilter = document.getElementById('dashboardStatusFilter').value;
            let dashData = [...myReports].sort((a,b) => b.id - a.id);
            if(dashFilter !== 'all') dashData = dashData.filter(r => r.status === dashFilter);
            
            trackerList.innerHTML = dashData.length ? dashData.slice(0,5).map(r => {
                const s = r.status || "Pending";
                const sClass = s === "In Progress" ? "status-inprogress" : (s === "Resolved" ? "status-resolved" : "status-pending");
                const uColor = r.urgency.includes('High') ? '#ef4444' : (r.urgency === 'Medium' ? '#f59e0b' : '#10b981');

                return `
                <div style="margin-bottom:12px; padding:15px; background:#f8fafc; border:1px solid #e2e8f0; border-left:5px solid ${uColor}; border-radius:8px; display:flex; flex-wrap:wrap; gap:15px; align-items:center;">
                    ${r.img ? `<img src="${r.img}" onclick="openImageViewer('${r.img}')" style="width:50px; height:50px; border-radius:6px; object-fit:cover; cursor:pointer;">` : ''}
                    <div style="flex:1;">
                        <span class="timestamp">${r.displayDate}</span>
                        <strong>${r.title}</strong>
                        <small style="display:block; color:#64748b;">${r.loc}</small>
                    </div>
                    <span class="badge ${sClass}">${s}</span>
                    <div style="display:flex; gap:10px;">
                        <button onclick="editReport(${r.id})" style="background:none; border:none; color:#3b82f6; cursor:pointer; font-size:16px;"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteReport(${r.id})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:16px;"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            }).join('') : '<p style="text-align:center; color:#94a3b8;">No reports found.</p>';

            // History List
            const catF = document.getElementById('filterCategory').value;
            const statF = document.getElementById('filterHistoryStatus').value;
            const sortF = document.getElementById('sortDate').value;
            let histData = [...myReports];
            if(catF !== 'all') histData = histData.filter(r => r.cat === catF);
            if(statF !== 'all') histData = histData.filter(r => r.status === statF);
            histData.sort((a,b) => sortF === 'newest' ? b.id - a.id : a.id - b.id);

            historyList.innerHTML = histData.length ? histData.map(r => {
                const s = r.status || "Pending";
                const sClass = s === "In Progress" ? "status-inprogress" : (s === "Resolved" ? "status-resolved" : "status-pending");
                const uClass = r.urgency.toLowerCase().includes('high') ? 'badge-high' : (r.urgency === 'Medium' ? 'badge-medium' : 'badge-low');
                
                return `
                <div class="card" style="margin-bottom:15px; display:flex; flex-wrap:wrap; gap:20px; align-items:center;">
                    <div style="flex:1;">
                        <span class="timestamp">${r.displayDate}</span>
                        <h4 style="margin:0;">${r.title}</h4>
                        <small>${r.loc} | ${r.cat}</small>
                    </div>
                    <span class="badge ${uClass}">${r.urgency}</span>
                    <span class="badge ${sClass}">${s}</span>
                </div>`;
            }).join('') : '<p style="text-align:center; color:#94a3b8;">No records found.</p>';
        };

        window.deleteReport = (id) => { if(confirm("Delete this report?")) { let rs = JSON.parse(localStorage.getItem('reports')).filter(r => r.id !== id); localStorage.setItem('reports', JSON.stringify(rs)); loadReports(); } };
        window.editReport = (id) => {
            const r = JSON.parse(localStorage.getItem('reports')).find(x => x.id === id);
            if(r) {
                window.editingReportId = id;
                document.getElementById('issue_title').value = r.title;
                document.getElementById('description').value = r.desc;
                document.getElementById('category').value = r.cat;
                document.getElementById('location').value = r.loc;
                const tag = r.urgency === 'Medium' ? 'medium' : (r.urgency.includes('High') ? 'high' : 'low');
                selectUrgency(r.urgency, document.querySelector(`.urgency-tag.${tag}`));
                showView('submit');
                document.querySelector('#report-form button').innerText = "Update Report";
            }
        };
        window.showView = (v) => {
            document.querySelectorAll('.dashboard-view').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.sidebar li').forEach(x => x.classList.remove('active'));
            document.getElementById('view-'+v).classList.add('active');
            document.getElementById('nav-'+v).classList.add('active');
            if(v !== 'submit') { loadReports(); document.querySelector('#report-form button').innerText = "Submit Report"; window.editingReportId = null; }
            if(window.innerWidth <= 768) toggleMobileMenu();
        };
        window.selectUrgency = (l, e) => { document.querySelectorAll('.urgency-tag').forEach(x => x.classList.remove('active')); e.classList.add('active'); document.getElementById('urgency_level').value = l; };
        window.previewImage = (e) => { const reader = new FileReader(); reader.onload = () => { document.getElementById('previewContainer').innerHTML = `<img src="${reader.result}" style="width:100%; height:100%; object-fit:cover;">`; document.getElementById('previewContainer').dataset.base64 = reader.result; }; if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]); };
        window.openImageViewer = (src) => { document.getElementById('fullSizeImage').src = src; document.getElementById('imageViewerModal').style.display = "flex"; };
        window.closeImageViewer = () => { document.getElementById('imageViewerModal').style.display = "none"; };
        window.toggleZoom = (e) => { e.stopPropagation(); document.getElementById('fullSizeImage').classList.toggle('zoomed'); };
    </script>
</body>
</html>
