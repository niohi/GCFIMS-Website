<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GC-FIMS - Login</title>
    <link rel="icon" type="image/png" href="assets/favicon-32x32.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="layout">
    <header class="header">
        <img src="assets/Logo.png" class="header__logo" alt="GC Logo">
        <div class="header__text">
            <h1 class="header__title">GC-FIMS</h1>
            <p class="header__subtitle">Facility Issue Management System</p>
        </div>
    </header>

    <div class="layout__content">
        <section class="auth-info">
            <div class="auth-info__card">
                <h2 class="auth-info__heading">Improving Gordon College, One Report at a Time</h2>
                <p class="auth-info__description">
                    Easily report facility issues like broken chairs or faulty utilities. 
                    Your report helps keep the campus safe, functional, and efficient.
                </p>
            </div>
        </section>

        <aside class="auth-panel">
            <div class="auth-card">
                <h2 class="auth-card__heading">Login</h2>
                <p class="auth-card__subheading">Welcome back. Please sign in.</p>

                <form id="login-form" action="#" method="POST">
                    <div class="form__group">
                        <label class="form__label">Email or ID Number</label>
                        <div class="form__input-wrapper">
                            <i class="fa-solid fa-user form__icon"></i>
                            <input name="email" class="form__input" type="text" placeholder="ID (e.g., 2021-XXXX) or Email" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form__group">
                        <label class="form__label">Password</label>
                        <div class="form__input-wrapper">
                            <i class="fa-solid fa-lock form__icon"></i>
                            <input name="password" class="form__input" type="password" placeholder="Enter your password" required autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="button--primary">Login</button>

                    <div class="auth-card__footer">
                        <a href="forgot-password.html" class="auth-card__link">Forgot password?</a>
                    </div>
                </form>
            </div>
        </aside>
    </div>
</main>

<script src="/script/script.js"></script>
</body>
</html>
