<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GC-FIMS - Forgot Password</title>
    <link rel="icon" type="image/png" href="assets/favicon-32x32.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="layout">
    <header class="header">
        <img src="assets/Logo.png" class="header__logo" alt="GC Logo">
        <div class="header__text">
            <h1 class="header__title">GC-FIMS</h1>
            <p class="header__subtitle">Facility Issue Management System</p>
        </div>
    </header>

    <div class="layout__content">
        <section class="auth-info">
            <div class="auth-info__card">
                <h2 class="auth-info__heading">Account Recovery Assistance</h2>
                <p class="auth-info__description">
                    Don't worry, it happens. Provide your registered Account ID and we will help you get back to making Gordon College a better place.
                </p>
            </div>
        </section>

        <aside class="auth-panel">
            <div class="auth-card">
                <h2 class="auth-card__heading">Forgot Password</h2>
                <p class="auth-card__subheading">Enter your ID to receive a reset link.</p>

                <form id="forgot-password-form" action="#" method="POST">
                    <div class="form__group">
                        <label class="form__label">Account ID</label>
                        <div class="form__input-wrapper">
                            <i class="fa-solid fa-id-card form__icon"></i>
                            <input name="account_id" class="form__input" type="text" placeholder="e.g. 2021-10042" required autocomplete="username" />
                        </div>
                    </div>

                    <button type="submit" class="button--primary">
                        Send Reset Link
                    </button>

                    <div class="auth-card__footer">
                        <a href="login.html" class="auth-card__link">
                            <i class="fa-solid fa-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </aside>
    </div>
</main>

<script src="/script/script.js"></script>
</body>
</html>
